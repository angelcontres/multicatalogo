# ==============================================================================
# MULTICATÁLOGO - ROOT DOCKER COMPOSE ORCHESTRATION
# ==============================================================================
# Orquestación completa de la solución MultiCatálogo:
#   - gateway:  Nginx Reverse Proxy en puerto 80 (y 443)
#   - frontend: React 19 SPA en Nginx Alpine
#   - backend:  Go 1.24 / Fiber en puerto 3000
#   - postgres: PostgreSQL 16 Alpine en puerto host 5434
#   - redis:    Redis 7 Alpine en puerto host 6379
# ==============================================================================

services:
  gateway:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: multicatalogo-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - public-net
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/gateway-health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  frontend:
    build:
      context: ./multicatalogo-frontend
      dockerfile: Dockerfile
    container_name: multicatalogo-frontend
    restart: unless-stopped
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./multicatalogo-backend
      dockerfile: Dockerfile
    container_name: multicatalogo-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      APP_ENV: "${APP_ENV:-production}"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-multicatalogo}"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      JWT_SECRET: "${JWT_SECRET:-clave-super-secreta-multicatalogo-2026}"
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: multicatalogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-multicatalogo}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-multicatalogo}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multicatalogo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
    name: multicatalogo_pgdata
  redisdata:
    name: multicatalogo_redisdata

networks:
  public-net:
    name: multicatalogo_public
    driver: bridge
  backend-net:
    name: multicatalogo_backend
    driver: bridge
  data-net:
    name: multicatalogo_data
    driver: bridge
