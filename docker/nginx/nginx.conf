# ==============================================================================
# MULTICATÁLOGO - NGINX REVERSE PROXY & API GATEWAY DE PRODUCCIÓN
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de logs con tiempos de respuesta para observabilidad
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Optimizaciones del Kernel para I/O de red
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Tamaños de buffers y límites de carga
    client_body_buffer_size 128k;
    client_max_body_size 15M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Zonas de Rate Limiting (Protección contra DDoS y Fuerza Bruta)
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_checkout:10m rate=15r/m;
    limit_req_status 429;

    # Definición de Upstreams con keepalive para rendimiento
    upstream backend_upstream {
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost _;

        # Cabeceras de seguridad globales
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Verificación de salud del Reverse Proxy Gateway
        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","service":"multicatalogo"}';
        }

        # ----------------------------------------------------------------------
        # ENDPOINTS SENSIBLES CON RATE LIMITING ESTRICTO
        # ----------------------------------------------------------------------

        # Protección contra ataques de fuerza bruta en autenticación y registro
        location ~ ^/api/(login|register) {
            limit_req zone=api_auth burst=5 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # Protección del endpoint transaccional de checkout
        location = /api/checkout {
            limit_req zone=api_checkout burst=5 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # API GENERAL (CATÁLOGO, RED, SALUD)
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ----------------------------------------------------------------------
        # FRONTEND SPA (RUTAS ESTÁTICAS Y REACT)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout 20s;
            proxy_read_timeout 20s;
        }

        # Páginas de error personalizadas
        error_page 502 503 504 /gateway_error.json;
        location = /gateway_error.json {
            default_type application/json;
            return 503 '{"status":503,"message":"Servicio temporalmente no disponible. Intente nuevamente en unos instantes."}';
        }
    }
}
